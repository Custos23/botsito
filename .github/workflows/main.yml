name: Bot 200 SPY Automatico

on:
  schedule:
    # Corre todos los días a las 21:00 UTC (después del cierre de la bolsa de Nueva York)
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Te permite correrlo manualmente cuando quieras desde la web de GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Ejecutar el bot de trading
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
